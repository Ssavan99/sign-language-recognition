[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-alphabet-recognition"
version = "0.1.0"
description = "Reproducible isolated-image ASL alphabet classification pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "scikit-learn>=1.3,<2",
  "torch==2.7.1",
  "torchvision==0.22.1",
]

[project.optional-dependencies]
data = ["kagglehub>=1.0,<2"]
demo = ["gradio>=5,<7"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]
all = [
  "gradio>=5,<7",
  "kagglehub>=1.0,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
asl-recognition = "asl_recognition.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
