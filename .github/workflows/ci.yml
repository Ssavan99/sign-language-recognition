name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[all]" -c constraints.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint
        run: ruff check --no-cache src tests tools

      - name: Check formatting
        run: ruff format --check src tests tools

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Python suite proves the exported weights are the checkpoint. These
      # prove the browser's own forward pass and landmark normaliser reproduce
      # PyTorch, which nothing else checks: a correct network fed wrongly
      # normalised numbers still returns confident nonsense.
      - name: Check browser model parity
        run: |
          node tools/check_browser_model.mjs
          node tools/check_landmark_model.mjs

      - name: Test generated-data workflow
        env:
          MPLBACKEND: Agg
        run: pytest --cov=asl_recognition --cov-report=term-missing --cov-fail-under=75
